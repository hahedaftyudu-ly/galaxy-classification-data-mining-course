<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
<dir>/System/Library/Fonts</dir>
<dir>/System/Library/Fonts/Supplemental</dir>
<dir>/Library/Fonts</dir>
<cachedir>/tmp/codex-dm-fontcache</cachedir>
<match target="pattern"><test name="family"><string>SimSun</string></test><edit name="family" mode="prepend"><string>Songti SC</string></edit></match>
<match target="pattern"><test name="family"><string>宋体</string></test><edit name="family" mode="prepend"><string>Songti SC</string></edit></match>
<match target="pattern"><test name="family"><string>黑体</string></test><edit name="family" mode="prepend"><string>Heiti SC</string></edit></match>
<match target="pattern"><test name="family"><string>等线</string></test><edit name="family" mode="prepend"><string>Heiti SC</string></edit></match>
</fontconfig>
